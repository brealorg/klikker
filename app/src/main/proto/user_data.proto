// Persisted state for Proto DataStore.
syntax = "proto3";

package userdata;

option java_package = "no.enaasen.tvremote.proto.userdata";
option java_multiple_files = true;

message SavedTv {
  string id = 1;
  string name = 2;
  string host = 3;
  int32 port = 4;
  // SHA-256 of the TV's TLS certificate, pinned at pairing time.
  bytes certificate_sha256 = 5;
  repeated SavedShortcut shortcuts = 6;
  // False until shortcuts are first edited for this TV; until then the
  // legacy shared shortcuts in UserData apply.
  bool shortcuts_initialized = 7;
  // Apps the TV has reported in the foreground, most recent first.
  repeated SeenApp seen_apps = 8;
}

message SeenApp {
  string package_name = 1;
  int64 last_seen_millis = 2;
}

message SavedShortcut {
  string label = 1;
  string package_name = 2;
}

message SavedSettings {
  // 1 (least sensitive) to 5; 0 means unset and maps to the default.
  int32 swipe_sensitivity = 1;
  bool fling_enabled = 2;
  // Stored inverted so the default (false) keeps volume keys controlling the TV.
  bool volume_keys_disabled = 3;
  // Inverted so the default (false) keeps the connection open in the background.
  bool background_connection_disabled = 4;
  bool hold_repeat_disabled = 5;
  // 1 (calm) to 3 (fast); 0 means unset and maps to the default.
  int32 hold_repeat_speed = 6;
  // Denon/Marantz receiver controlled over the network; empty if none.
  string receiver_host = 7;
  // Half-dB steps per volume press (1, 2 or 4); 0 means unset and maps to the default.
  int32 receiver_volume_step = 8;
  // Inverted so the default (false) shows names under app icons.
  bool app_names_hidden = 9;
}

message UserData {
  repeated SavedTv tvs = 1;
  string selected_id = 2;
  // Legacy: shortcuts shared by all TVs, before they were kept per TV.
  repeated SavedShortcut shortcuts = 3;
  bool shortcuts_initialized = 4;
  SavedSettings settings = 5;
}
